<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MogBrowser</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
</head>
<body class="w3-dark-mode">
    <div
            class="w3-sidebar w3-bar-block w3-collapse w3-card"
            style="width: 200px;z-index: 2"
            id="sidebar"
    >
        <button
                onclick="sidebarClose()"
                class="w3-bar-item w3-button w3-large w3-hide-large"
        >
           <i class="fa fa-times" aria-hidden="true"></i>
        </button>
        <h5 class="w3-bar-item w3-hide-medium w3-hide-small">Scopes</h5>

        {% for scope in scopes %}
        <a
                class="w3-bar-item w3-button w3-hover-none w3-hover-text-green"
                href="{{ url_for('gallery.index', scope=scope) }}"
        >
            {{ scope }}
        </a>
        {% endfor %}

    </div>

    <div class="w3-main" style="margin-left: 200px">

    <div class="w3-container">
        <h2>
            <button class="w3-button w3-hide-large" onclick="sidebarOpen()">☰</button>
            {{ current_scope }} - {{ current_path }}
        </h2>
    </div>

    <div class="w3-container">
    <div class="w3-row-padding">
        {% for path in paths %}
        <div class="w3-col s6 m4 l3 w3-margin-bottom">
        <div class="w3-card path-card" data-path-name="{{ path.name }}" data-path-type="{{ path.type }}">
            {% if path.type == "directory" %}
            <a href="{{ url_for('gallery.index', scope=current_scope, path=current_path ~ '/' ~ path.name) }}">
            {% else %}
            <a href="{{ url_for('media.file', scope=current_scope, path=current_path ~ '/' ~ path.name) }}">
            {% endif %}
            <img src="https://developmizer.com/wp-content/uploads/2024/01/placeholder_large_dark.jpg" alt="{{ path.name }}" loading="lazy">
            <div class="w3-container">
            <h3>{{ path.name }}</h3>
            </div>
            </a>
        </div>
        </div>
        {% endfor %}
    </div>
    </div>

    <script>
        const currentScope = {{ current_scope | tojson }};
        const currentPath = {{ current_path | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/gallery.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/events.js') }}" defer></script>
</body>
</html>
