[project]
name = "mogbrowser"
version = "0.1.0"
description = "A self-hosted file browser."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "pillow>=12.3.0",
    "quart>=0.23.1",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
